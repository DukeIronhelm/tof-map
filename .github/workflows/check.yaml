---
name: PR check
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Run hk checks
        run: hk check
      - name: npm ci
        run: npm ci
      - name: npm run build
        run: npm run build
